name: Deploy accepted city site
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing the checked city site and detached receipts
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download bounded detached release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ vars.PAGES_ACCEPTANCE_SHA256 }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,100}', tag):
              raise SystemExit('Invalid release tag')
          if not re.fullmatch(r'[0-9a-f]{64}', os.environ['EXPECTED_SHA256']):
              raise SystemExit('No trusted acceptance digest configured')
          assets = json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',os.environ['GITHUB_REPOSITORY'],'--json','assets']))['assets']
          limits = {'site.tar.gz':450_000_000,'site-integrity.json':20_000_000,'site-acceptance.json':100_000}
          for name, limit in limits.items():
              matches = [a for a in assets if a['name'] == name]
              if len(matches) != 1 or matches[0]['size'] > limit:
                  raise SystemExit('Missing or oversized release asset')
          pathlib.Path('incoming').mkdir()
          subprocess.run(['gh','release','download',tag,'--repo',os.environ['GITHUB_REPOSITORY'],'--dir','incoming','--pattern','site.tar.gz','--pattern','site-integrity.json','--pattern','site-acceptance.json'],check=True)
          PY
      - name: Verify current scientific and product acceptance
        env:
          EXPECTED_SHA256: ${{ vars.PAGES_ACCEPTANCE_SHA256 }}
        run: |
          CITY=$(python -c 'import json; print(json.load(open("city-config.json"))["city"])')
          python scripts/migration/verify_release.py --acceptance incoming/site-acceptance.json --expected-sha256 "$EXPECTED_SHA256" --archive incoming/site.tar.gz --receipt incoming/site-integrity.json --output accepted-site --city "$CITY" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: accepted-site
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
